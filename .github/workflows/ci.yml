name: CI

# Checks every push to v2 and every pull request: version, types, build, links, content.
on:
  push:
    branches: [v2]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Version is SemVer
        run: bun run check:version
      - name: Types and content schema
        run: bun run check
      - name: Build
        run: bun run build
      - name: Links in the built site
        run: bun run check:links
      - name: Open TO CONFIRM markers
        # Warns on v2; the deploy workflow fails on them, so nothing unconfirmed goes live.
        run: bun run check:content --warn
